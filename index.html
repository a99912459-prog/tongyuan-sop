<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>統元豆花 - 門市SOP學習與考核系統</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="統元SOP">
  <style>
    :root {
      --primary: #c2410c;
      --primary-light: #ffedd5;
      --primary-dark: #9a3412;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border: #e2e8f0;
      --badge-sugar: #d97706;
      --badge-soup: #0284c7;
      --badge-main: #4f46e5;
      --badge-prep: #16a34a;
      --success: #16a34a;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 75px;
    }

    /* 頂部固定列 */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 8px 14px 6px 14px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .quiz-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 5px 11px;
      border-radius: 18px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .settings-icon-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: #64748b;
      padding: 5px 8px;
      border-radius: 18px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 學員進度指示條 */
    .trainee-bar {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 6px 10px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }
    .trainee-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
    }
    .trainee-name-tag {
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .trainee-progress-text {
      font-weight: 700;
      color: var(--primary);
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #ea580c, #16a34a);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 搜尋欄 */
    .search-bar {
      position: relative;
      margin-bottom: 2px;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      font-size: 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #f1f5f9;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 0.85rem;
    }
    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.1rem;
      color: #94a3b8;
      display: none;
      cursor: pointer;
    }

    /* 橫向滑動分類 Tab */
    .tab-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 14px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .tab-container::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex: 0 0 auto;
      padding: 6px 13px;
      font-size: 0.84rem;
      font-weight: 600;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 4px rgba(194, 65, 12, 0.25);
    }
    .tab-check {
      font-size: 0.72rem;
      display: none;
    }
    .tab-btn.completed .tab-check {
      display: inline;
    }

    /* 容器區塊 */
    main {
      padding: 12px 14px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 大類頂部橫幅 */
    .cat-hero {
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border: 1px solid #fed7aa;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .cat-hero h2 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-hero-rule {
      font-size: 0.82rem;
      color: #7c2d12;
      line-height: 1.45;
      margin-top: 4px;
    }
    .cat-hero-seq {
      background: #ffffff;
      border-radius: 8px;
      padding: 6px 10px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #9a3412;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      border-left: 3px solid var(--primary);
    }

    /* 品項卡片 */
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 8px;
    }
    .item-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
    }
    .item-sugar-badge {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
      white-space: nowrap;
    }

    /* 規格網格 */
    .item-specs {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.86rem;
    }
    .spec-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      line-height: 1.4;
    }
    .spec-label {
      flex: 0 0 68px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-align: center;
    }
    .label-main { background: #e0e7ff; color: #3730a3; }
    .label-ing { background: #dcfce7; color: #166534; }
    .label-soup { background: #e0f2fe; color: #0369a1; }
    .spec-val {
      flex: 1;
      color: #334155;
    }

    /* 製作要點提醒 */
    .item-notes {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 8px;
      border-left: 3px solid #cbd5e1;
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.4;
    }
    .item-notes ul {
      margin: 0;
      padding-left: 16px;
    }

    /* 防呆守則折疊區塊 */
    .rules-section {
      background: #fffbeb;
      border: 1px solid #fef3c7;
      border-radius: 12px;
      padding: 12px;
      margin-top: 16px;
    }
    .rules-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #92400e;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .rules-list {
      margin: 0;
      padding-left: 18px;
      font-size: 0.8rem;
      color: #78350f;
      line-height: 1.5;
    }

    /* 大類底部完成學習打卡按鈕 */
    .completion-box {
      margin-top: 24px;
      padding: 16px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }
    .completion-btn {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-not-done {
      background: var(--primary);
      color: white;
    }
    .btn-done {
      background: #ecfdf5;
      color: #065f46;
      border: 1.5px solid #a7f3d0;
    }

    /* 模組 7 特殊佈局 (加料區、桶蓋色標、杯型) */
    .addon-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .addon-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.82rem;
    }
    .addon-name {
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 2px;
    }
    .addon-portion {
      color: var(--primary);
      font-weight: 600;
      font-size: 0.86rem;
    }
    .addon-rule {
      color: #64748b;
      font-size: 0.74rem;
      margin-top: 2px;
    }

    .lid-list, .cup-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .lid-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.85rem;
    }
    .color-dot {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      border: 1px solid rgba(0,0,0,0.15);
    }

    /* 彈窗樣式 (Quiz & Profile & Settings) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 18px;
      max-width: 480px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.2);
      overflow: hidden;
    }
    .modal-header {
      padding: 14px 18px;
      background: var(--primary);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-weight: 700; font-size: 1.05rem; }
    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
    }
    .modal-body {
      padding: 18px;
      overflow-y: auto;
    }

    /* 測驗題目樣式 */
    .quiz-question-box {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .quiz-q-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 10px;
      line-height: 1.45;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quiz-option-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.86rem;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quiz-option-label:active {
      background: #f1f5f9;
    }
    .quiz-option-label.selected {
      border-color: var(--primary);
      background: #fff7ed;
      color: var(--primary-dark);
      font-weight: 600;
    }
    .quiz-option-label.correct {
      border-color: #22c55e;
      background: #f0fdf4;
      color: #166534;
      font-weight: 700;
    }
    .quiz-option-label.wrong {
      border-color: #ef4444;
      background: #fef2f2;
      color: #991b1b;
    }

    .submit-quiz-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .quiz-result-card {
      display: none;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      margin-top: 12px;
    }
    .quiz-score-big {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary);
      margin: 8px 0;
    }
    .sync-to-sheet-btn {
      width: 100%;
      padding: 12px;
      background: #16a34a;
      color: white;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* 表單輸入框 */
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.15);
    }

    /* 浮動提示 Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #0f172a;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
      z-index: 200;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .no-result {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <header>
    <div class="header-top">
      <div class="brand-title">
        <span>🥣 統元豆花 SOP 學習系統</span>
      </div>
      <div class="header-actions">
        <button class="quiz-btn" onclick="openQuiz()">
          <span>🎓 考核隨堂考</span>
        </button>
        <button class="settings-icon-btn" onclick="openSettings()" title="設定">
          <span>⚙️</span>
        </button>
      </div>
    </div>

    <!-- 學員資訊與進度指示條 -->
    <div class="trainee-bar" onclick="openProfileModal()">
      <div class="trainee-info-row">
        <span class="trainee-name-tag">
          👤 <span id="traineeNameDisplay">學員：未登錄</span>
          <span style="color:#94a3b8; font-weight:normal;">|</span>
          <span id="traineeBranchDisplay">點此設定門市</span>
        </span>
        <span class="trainee-progress-text" id="traineeProgressText">進度 0% (0/7)</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressBarFill"></div>
      </div>
    </div>

    <!-- 搜尋欄 -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="輸入品名、配料或規格 (如: 芋頭、豆漿、小碗)..." oninput="handleSearch()">
      <button id="clearSearchBtn" class="clear-search" onclick="clearSearch()">×</button>
    </div>
  </header>

  <!-- 七大分類 Tab 橫向滑動列 -->
  <nav class="tab-container" id="categoryTabs">
    <button class="tab-btn active" id="tabBtn1" onclick="switchCategory(1)"><span class="tab-check">✅</span>1. 豆花系列</button>
    <button class="tab-btn" id="tabBtn2" onclick="switchCategory(2)"><span class="tab-check">✅</span>2. 仙草系列</button>
    <button class="tab-btn" id="tabBtn3" onclick="switchCategory(3)"><span class="tab-check">✅</span>3. 薏仁系列</button>
    <button class="tab-btn" id="tabBtn4" onclick="switchCategory(4)"><span class="tab-check">✅</span>4. 刨冰系列</button>
    <button class="tab-btn" id="tabBtn5" onclick="switchCategory(5)"><span class="tab-check">✅</span>5. 湯芋圓系列</button>
    <button class="tab-btn" id="tabBtn6" onclick="switchCategory(6)"><span class="tab-check">✅</span>6. 飲品系列</button>
    <button class="tab-btn" id="tabBtn7" onclick="switchCategory(7)"><span class="tab-check">✅</span>7. 加料&規格</button>
  </nav>

  <!-- 主內容區塊 -->
  <main id="contentContainer">
    <!-- JS 動態載入分類內容或搜尋結果 -->
  </main>

  <!-- 學員身分設定彈窗 -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">👤 學員基本資料設定</span>
        <button class="close-btn" onclick="closeProfileModal()">✕</button>
      </div>
      <div class="modal-body">
        <div style="font-size: 0.85rem; color: #64748b; margin-bottom: 14px;">
          請填寫您的姓名與所屬門市，以便將研讀進度與考核成績正確記錄至管理人員的 Google 試算表：
        </div>
        <div class="form-group">
          <label class="form-label">學員姓名 *</label>
          <input type="text" id="inputStudentName" class="form-input" placeholder="例如：陳小明">
        </div>
        <div class="form-group">
          <label class="form-label">所屬門市 / 班別 *</label>
          <input type="text" id="inputStoreBranch" class="form-input" placeholder="例如：總店 / 早班">
        </div>
        <button class="submit-quiz-btn" onclick="saveProfile()">確認儲存</button>
      </div>
    </div>
  </div>

  <!-- 系統與後台 API 設定彈窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">⚙️ 系統設定 & Google 試算表串接</span>
        <button class="close-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Google Apps Script Web App 網址</label>
          <input type="text" id="inputApiUrl" class="form-input" placeholder="https://script.google.com/macros/s/.../exec">
          <div style="font-size: 0.74rem; color: #94a3b8; margin-top: 4px;">
            管理人員請依照 <code>google_sheet_setup_guide.md</code> 教學取得此網址貼入。
          </div>
        </div>
        <button class="submit-quiz-btn" onclick="saveSettings()">儲存設定</button>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border);">

        <div style="font-size: 0.84rem; color: #64748b; margin-bottom: 8px;">進度重設：</div>
        <button style="width: 100%; padding: 10px; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; border-radius: 10px; font-weight: 600; cursor: pointer;" onclick="resetAllProgress()">

      const nameEl = document.getElementById('traineeNameDisplay');

      const progressTextEl = document.getElementById('traineeProgressText');
      const progressFillEl = document.getElementById('progressBarFill');

      nameEl.innerText = traineeProfile.name ? `學員：${traineeProfile.name}` : '學員：未設定';

      const count = completedCategories.length;
      const pct = Math.round((count / 7) * 100);
      progressTextEl.innerText = `進度 ${pct}% (${count}/7)`;
      progressFillEl.style.width = `${pct}%`;

      // 更新 Tab 上的勾勾
      for (let i = 1; i <= 7; i++) {
        const tab = document.getElementById(`tabBtn${i}`);
        if (completedCategories.includes(i)) {
          tab.classList.add('completed');
        } else {
          tab.classList.remove('completed');
        }
      }
    }

    function switchCategory(catId) {
      if (!sopData) return;
      isSearchMode = false;
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').style.display = 'none';
      currentCategory = catId;

      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach((btn, idx) => {
        if (idx + 1 === catId) {
          btn.classList.add('active');
          btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          btn.classList.remove('active');
        }
      });

      renderCategory(catId);
      window.scrollTo({ top: 0, behavior: 'smooth' });

          <div class="addon-grid">
            ${cat.standard_addon_portions.map(a => `
              <div class="addon-card">
                <div class="addon-name">${a.item}</div>
                <div class="addon-portion">${a.portion}</div>
                <div class="addon-rule">${a.rule}</div>
              </div>
            `).join('')}
          </div>

          <h3 style="margin: 22px 0 8px 4px; font-size: 1rem; color: var(--text-main);">🎨 二、 桶子蓋標示顏色與標籤</h3>
          <div class="lid-list">
            ${cat.barrel_lid_colors.map(b => {
              let dotColor = '#cbd5e1';
              if (b.indicator.includes('藍')) dotColor = '#3b82f6';
              else if (b.indicator.includes('紅')) dotColor = '#ef4444';
              else if (b.indicator.includes('綠')) dotColor = '#22c55e';
              else if (b.indicator.includes('黃')) dotColor = '#eab308';
              else if (b.indicator.includes('白')) dotColor = '#f8fafc';
              else if (b.indicator.includes('黑')) dotColor = '#0f172a';
              else if (b.indicator.includes('粉')) dotColor = '#ec4899';
              else if (b.indicator.includes('灰')) dotColor = '#64748b';

              return `
                <div class="lid-item">
                  <div>
                    <span class="color-dot" style="background: ${dotColor};"></span>
                    <strong>${b.item}</strong>
                  </div>
                  <div style="font-weight: 600; color: var(--primary);">${b.indicator}</div>
                </div>
              `;
            }).join('')}
          </div>

          <h3 style="margin: 22px 0 8px 4px; font-size: 1rem; color: var(--text-main);">🥤 三、 外帶杯與專用紙碗容量規格</h3>
          <div class="cup-list">
            ${cat.cup_specifications.map(c => `
              <div class="lid-item" style="flex-direction: column; align-items: flex-start; gap: 4px;">
                <div style="display: flex; justify-content: space-between; width: 100%;">
                  <strong>${c.name}</strong>
                  <span style="color: var(--primary); font-weight: 700;">${c.capacity}</span>
                </div>
                <div style="font-size: 0.78rem; color: #64748b;">用途：${c.usage}</div>
              </div>
            `).join('')}
          </div>

          <div class="rules-section" style="margin-top: 20px;">
            <div class="rules-title">⚠️ 備料管理與安全原則</div>
            <ul class="rules-list">
              ${cat.golden_rules.map(r => `<li>${r}</li>`).join('')}
            </ul>
          </div>

          <div class="completion-box">
            <button class="completion-btn ${isCompleted ? 'btn-done' : 'btn-not-done'}" onclick="toggleCategoryCompletion(7)">
              <span>${isCompleted ? '✅ 本系列已完成研讀 (點擊取消)' : '📌 標記【加料與規格】已研讀完成'}</span>
            </button>
          </div>
        `;
        container.innerHTML = html;
      }
    }

    // 打卡切換完成狀態
    function toggleCategoryCompletion(catId) {
      const idx = completedCategories.indexOf(catId);
      let actionName = "";
      if (idx > -1) {
        completedCategories.splice(idx, 1);
        actionName = "取消標記研讀";
      } else {
        completedCategories.push(catId);
        actionName = "完成章節研讀";
      }

      localStorage.setItem('sop_completed_cats', JSON.stringify(completedCategories));
      updateProfileUI();
      renderCategory(catId);

      // 同步回傳至 Google Sheet
      const catTitle = sopData[catId].title;
      const count = completedCategories.length;
      const pct = Math.round((count / 7) * 100);

      sendPayloadToSheet({
        student_name: traineeProfile.name || "未登錄",
        store_branch: traineeProfile.branch || "未指定",
        action: actionName,
        category: catTitle,
        score: "-",
        progress: `${pct}% (${count}/7)`,
        notes: `學員點擊了【${catTitle}】完成按鈕`
      });

      showToast(`已更新【${catTitle}】研讀進度！`);
    }

    // 搜尋功能
    function handleSearch() {
      const kw = document.getElementById('searchInput').value.trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (!kw) {
        clearBtn.style.display = 'none';
        if (isSearchMode) switchCategory(currentCategory);
        return;
      }
      clearBtn.style.display = 'block';
      isSearchMode = true;

      const container = document.getElementById('contentContainer');
      let matches = [];

      for (let i = 1; i <= 6; i++) {
        const cat = sopData[i];
        cat.items.forEach(it => {
          if (it.name.toLowerCase().includes(kw) ||
              it.ingredients.toLowerCase().includes(kw) ||
              it.soup_base.toLowerCase().includes(kw) ||
              it.main_ingredient.toLowerCase().includes(kw)) {
            matches.push({ catTitle: cat.title, item: it });
          }
        });
      }

      const add7 = sopData[7].standard_addon_portions.filter(a => a.item.toLowerCase().includes(kw));

      if (matches.length === 0 && add7.length === 0) {
        container.innerHTML = `<div class="no-result">🔍 找不到包含「<strong>${kw}</strong>」的品項或配料，請嘗試更簡短的關鍵字。</div>`;
        return;
      }

      let html = `<div style="font-size: 0.88rem; color: #64748b; margin-bottom: 12px;">🔍 搜尋「<strong>${kw}</strong>」找到 ${matches.length + add7.length} 筆結果：</div>`;

      matches.forEach(m => {
        const it = m.item;
        html += `
          <div class="item-card">
            <div style="font-size: 0.75rem; color: var(--primary); font-weight: 700; margin-bottom: 4px;">【${m.catTitle}】</div>
            <div class="item-header">
              <h3 class="item-title">${it.name}</h3>
              <span class="item-sugar-badge">${it.sugar_level}</span>
            </div>
            <div class="item-specs">
              <div class="spec-row">
                <span class="spec-label label-main">主料規格</span>
                <span class="spec-val"><strong>${it.main_ingredient}</strong></span>
              </div>
              <div class="spec-row">
                <span class="spec-label label-ing">標準配料</span>
                <span class="spec-val">${it.ingredients}</span>
              </div>
              <div class="spec-row">
                <span class="spec-label label-soup">搭配湯底</span>
                <span class="spec-val">${it.soup_base}</span>
              </div>
            </div>
          </div>
        `;
      });

      if (add7.length > 0) {
        html += `<h4 style="margin: 16px 0 8px 0; font-size: 0.95rem;">【加料區符合項目】</h4>`;
        add7.forEach(a => {
          html += `
            <div class="addon-card" style="margin-bottom: 6px;">
              <div class="addon-name">${a.item}</div>
              <div class="addon-portion">${a.portion}</div>
              <div class="addon-rule">${a.rule}</div>
            </div>
          `;
        });
      }

      container.innerHTML = html;
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').style.display = 'none';
      switchCategory(currentCategory);
    }

    // ==========================================
    // 隨堂測驗系統 (選擇題模式)
    // ==========================================
    const quizQuestionBank = [
      {
        q: "綜合豆花的黃金比例為何？做餐標準順序為何？",
        options: [

          "比例 1:2:1；順序：豆花 ➔ 配料 ➔ 碎冰 ➔ 糖膏",

      {

      {

        options: [
          "薏仁:藍色 | 紅豆:紅色 | 綠豆:綠色 | 甜湯:黃色",

      {

        options: [

      },
      {

        options: [

          "飲品豆漿 24分糖；豆漿豆花 18分糖"

    function openQuiz() {
      const modal = document.getElementById('quizModal');
      const container = document.getElementById('quizQuestionsContainer');
      const resultCard = document.getElementById('quizResultCard');
      const submitBtn = document.getElementById('submitQuizBtn');

      resultCard.style.display = 'none';
      submitBtn.style.display = 'block';

      // 隨機抽選 5 題
      currentQuizQuestions = [...quizQuestionBank].sort(() => 0.5 - Math.random()).slice(0, 5);

      let html = '';
      currentQuizQuestions.forEach((qItem, qIdx) => {
        html += `
          <div class="quiz-question-box" id="qBox${qIdx}">
            <div class="quiz-q-title">Q${qIdx + 1}. ${qItem.q}</div>
            <div class="quiz-options">
              ${qItem.options.map((opt, oIdx) => `
                <div class="quiz-option-label" onclick="selectQuizOption(${qIdx}, ${oIdx})" id="opt_${qIdx}_${oIdx}">
                  <input type="radio" name="quiz_q_${qIdx}" value="${oIdx}" style="margin: 0; pointer-events: none;">
                  <span>${opt}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      modal.style.display = 'flex';
    }

    function selectQuizOption(qIdx, oIdx) {
      const parent = document.getElementById(`qBox${qIdx}`);
      const options = parent.querySelectorAll('.quiz-option-label');
      options.forEach((opt, idx) => {
        const radio = opt.querySelector('input');
        if (idx === oIdx) {
          opt.classList.add('selected');
          radio.checked = true;
        } else {
          opt.classList.remove('selected');
          radio.checked = false;
        }
      });
    }

    function gradeQuiz() {
      let score = 0;
      let unanswered = 0;

      currentQuizQuestions.forEach((qItem, qIdx) => {
        const parent = document.getElementById(`qBox${qIdx}`);
        const checked = parent.querySelector('input:checked');
        if (!checked) {
          unanswered++;
        }
      });

      if (unanswered > 0) {
        alert(`您還有 ${unanswered} 題尚未作答，請完成後再交卷！`);
        return;
      }

      // 計算得分與標示對錯
      currentQuizQuestions.forEach((qItem, qIdx) => {
        const parent = document.getElementById(`qBox${qIdx}`);
        const checked = parent.querySelector('input:checked');
        const userChoice = parseInt(checked.value);

        const options = parent.querySelectorAll('.quiz-option-label');
        options.forEach((opt, oIdx) => {
          opt.style.pointerEvents = 'none'; // 鎖定
          if (oIdx === qItem.ans) {
            opt.classList.add('correct');
          }
          if (oIdx === userChoice && userChoice !== qItem.ans) {
            opt.classList.add('wrong');
          }
        });

        if (userChoice === qItem.ans) {
          score += 20;
        }
      });

      latestQuizScore = score;
      document.getElementById('submitQuizBtn').style.display = 'none';

      const resultCard = document.getElementById('quizResultCard');
      const scoreText = document.getElementById('quizScoreText');
      const feedbackText = document.getElementById('quizFeedbackText');

      scoreText.innerText = `${score} 分`;
      if (score === 100) {
        scoreText.style.color = '#16a34a';
        feedbackText.innerText = '太優秀了！完美答對全部 5 題！🎉';
      } else if (score >= 80) {
        scoreText.style.color = '#ea580c';
        feedbackText.innerText = '及格通過！部分細節可再看手冊確認喔！👍';
      } else {
        scoreText.style.color = '#dc2626';
        feedbackText.innerText = '尚未達標，建議回到對應系列加強複習再測驗！💪';
      }

      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth' });
    }

    function syncScoreToSheet() {
      if (latestQuizScore === null) return;

      const count = completedCategories.length;
      const pct = Math.round((count / 7) * 100);

      sendPayloadToSheet({
        student_name: traineeProfile.name || "未登錄",
        store_branch: traineeProfile.branch || "未指定",
        action: "隨堂考核測驗",
        category: "綜合隨機測驗",
        score: `${latestQuizScore} 分 (${latestQuizScore / 20}/5題)`,
        progress: `${pct}% (${count}/7)`,
        notes: latestQuizScore >= 80 ? "合格過關" : "需再次複習"
      });

      const syncBtn = document.getElementById('syncScoreBtn');
      syncBtn.innerHTML = '<span>✅ 成績已成功上傳試算表！</span>';
      syncBtn.style.background = '#047857';
      syncBtn.style.pointerEvents = 'none';
      showToast('測驗成績已同步至管理人員 Google 試算表！');
    }

    function closeQuiz() {
      document.getElementById('quizModal').style.display = 'none';
    }

    // ==========================================
    // 學員身分與設定 Modal
    // ==========================================
    function openProfileModal() {
      document.getElementById('inputStudentName').value = traineeProfile.name || '';
      document.getElementById('inputStoreBranch').value = traineeProfile.branch || '';
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function saveProfile() {
      const name = document.getElementById('inputStudentName').value.trim();
      const branch = document.getElementById('inputStoreBranch').value.trim();
      if (!name) {
        alert('請輸入學員姓名！');
        return;
      }
      traineeProfile = { name: name, branch: branch || '門市部' };
      localStorage.setItem('sop_trainee_profile', JSON.stringify(traineeProfile));
      updateProfileUI();
      closeProfileModal();
      showToast(`已儲存學員：${name} (${traineeProfile.branch})`);

      // 登錄時回傳一筆「登入建立」
      const count = completedCategories.length;
      const pct = Math.round((count / 7) * 100);
      sendPayloadToSheet({
        student_name: traineeProfile.name,
        store_branch: traineeProfile.branch,
        action: "登入系統",
        category: "-",
        score: "-",
        progress: `${pct}% (${count}/7)`,
        notes: "首次綁定或更新學員資料"
      });
    }

    function openSettings() {
      document.getElementById('inputApiUrl').value = gasApiUrl;
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
      const url = document.getElementById('inputApiUrl').value.trim();
      gasApiUrl = url;
      localStorage.setItem('sop_gas_api_url', url);
      closeSettings();
      showToast('已更新 Google 試算表 API 網址！');
    }

    function resetAllProgress() {
      if (confirm('確定要清除所有研讀打卡進度嗎？（這不會影響已上傳至 Google 試算表的歷史紀錄）')) {
        completedCategories = [];
        localStorage.removeItem('sop_completed_cats');
        updateProfileUI();
        renderCategory(currentCategory);
        closeSettings();
        showToast('已重設研讀進度');
      }
    }

    // ==========================================
    // Google Sheets API 同步函式
    // ==========================================
    function sendPayloadToSheet(payload) {
      if (!gasApiUrl) {
        console.warn('尚未設定 Google Apps Script Web App 網址，已先儲存於手機本機。');
        return;
      }

      try {
        fetch(gasApiUrl, {
          method: 'POST',
          mode: 'no-cors', // 繞過跨域直接回傳寫入
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(() => {
          console.log('已發送資料至 Google 試算表：', payload);
        }).catch(err => {
          console.error('發送至 Google 試算表失敗：', err);
        });
      } catch (e) {
        console.error('發送例外：', e);
      }
    }

    // 浮動提示框
    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      const msgEl = document.getElementById('toastMsg');
      msgEl.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    // 啟動程式
    window.addEventListener('DOMContentLoaded', init);
  </script>
